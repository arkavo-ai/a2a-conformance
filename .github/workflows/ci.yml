name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build runner
        run: cargo build --manifest-path runner/Cargo.toml
      - name: Validate scenarios
        run: ./runner/target/debug/a2a-conformance-runner validate

  matrix-macos:
    name: Matrix (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      # Explicit core cells only: the arkavo-ext-* adapters depend on the
      # private arkavo-a2a-rs / arkavo-a2a-swift checkouts (path deps, §7.5
      # licensing pending), so public CI cannot build them. The runner only
      # builds implementations referenced by the selected cells, so listing
      # the 9 core cells keeps the ext adapters out of the build entirely.
      # Extension cells run locally / on self-hosted runners; their evidence
      # is the committed reports/baseline-ext.ndjson (IDENTITY-HARNESS.md).
      - name: Run matrix
        run: |
          cargo build --release --manifest-path runner/Cargo.toml
          ./runner/target/release/a2a-conformance-runner run \
            --baseline reports/baseline.ndjson --report reports-ci \
            --cell client=rust-a2a,server=rust-a2a \
            --cell client=rust-a2a,server=arkavo-swift \
            --cell client=rust-a2a,server=tolgaki-swift \
            --cell client=arkavo-swift,server=rust-a2a \
            --cell client=arkavo-swift,server=arkavo-swift \
            --cell client=arkavo-swift,server=tolgaki-swift \
            --cell client=tolgaki-swift,server=rust-a2a \
            --cell client=tolgaki-swift,server=arkavo-swift \
            --cell client=tolgaki-swift,server=tolgaki-swift
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-macos
          path: reports-ci/

  matrix-linux:
    name: Matrix (Linux)
    runs-on: ubuntu-latest
    container: swift:6.3
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: apt-get update && apt-get install -y curl build-essential
      - name: Install Rust
        shell: bash
        run: |
          set -o pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # No --baseline yet: the committed baseline is macOS-generated, and
      # Darwin-vs-corelibs divergence is expected signal. Once a Linux run is
      # reviewed, commit reports/baseline-linux.ndjson and gate on it here.
      #
      # tolgaki-swift is excluded on Linux: its server stack does not compile
      # there (a2a-client-swift 1.0.22 lacks FoundationNetworking imports) —
      # recorded as finding 10 in FINDINGS.md.
      - name: Run matrix
        run: |
          cargo build --release --manifest-path runner/Cargo.toml
          ./runner/target/release/a2a-conformance-runner run --report reports-ci \
            --cell client=rust-a2a,server=rust-a2a \
            --cell client=rust-a2a,server=arkavo-swift \
            --cell client=arkavo-swift,server=rust-a2a \
            --cell client=arkavo-swift,server=arkavo-swift
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-linux
          path: reports-ci/
