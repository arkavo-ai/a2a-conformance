[package]
name = "a2a-conformance-runner"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Pairwise interop matrix runner for A2A SDK implementations"

[[bin]]
name = "a2a-conformance-runner"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
jsonschema = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
